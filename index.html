<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flowday | Task Console</title>
  <style>
    :root{--bg:#050912;--panel:#0b1422;--panel2:#101e31;--line:#1d3954;--text:#e9f7ff;--muted:#83a5bb;--cyan:#38e8ff;--violet:#9e83ff;--danger:#ff6d9e;--shadow:0 20px 60px #0008}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);background-image:linear-gradient(#15304a22 1px,transparent 1px),linear-gradient(90deg,#15304a22 1px,transparent 1px),radial-gradient(circle at 85% 0,#16395e88,transparent 38%);background-size:32px 32px,32px 32px,100% 100%}button,input,select{font:inherit}button{cursor:pointer}
    .app{display:flex;min-height:100vh}.sidebar{width:250px;padding:28px 20px;background:linear-gradient(180deg,#091522,#060d17);border-right:1px solid #225779;box-shadow:10px 0 40px #0008}.logo{display:flex;align-items:center;gap:10px;margin:0 10px 38px;font-size:20px;font-weight:700;letter-spacing:1px;text-shadow:0 0 14px var(--cyan)}.logo-mark{width:18px;height:18px;border:2px solid var(--cyan);border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}.user{display:flex;gap:10px;align-items:center;margin:0 8px 28px}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 0 18px #38e8ff66}.user strong,.user small{display:block}.user strong{font-size:13px}.user small{margin-top:3px;color:var(--muted);font-size:11px}.nav{display:grid;gap:4px}.nav button,.project,.logout{display:flex;align-items:center;gap:10px;width:100%;padding:11px;border:0;border-radius:7px;color:var(--muted);background:transparent;text-align:left}.nav button:hover,.nav button.active,.project:hover{color:#fff;background:#123752;box-shadow:inset 3px 0 var(--cyan)}.nav-label{display:flex;justify-content:space-between;margin:28px 11px 7px;color:#638da6;font-size:11px;letter-spacing:2px}.project i{width:8px;height:8px;border-radius:50%;background:var(--violet)}.logout{margin-top:32px;color:#668da5}
    .main{width:min(1100px,100%);padding:55px 6%}.top{display:flex;justify-content:space-between;gap:20px}.eyebrow{margin:0 0 10px;color:var(--cyan);font-size:11px;letter-spacing:2px}.top h1{margin:0;font-size:30px;text-shadow:0 0 25px #38e8ff33}.wave{color:var(--cyan)}.welcome{margin:10px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:10px}.search{display:flex;align-items:center;gap:8px;width:230px;padding:10px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--cyan)}.search input{width:100%;border:0;outline:0;color:var(--text);background:transparent}.quick-add{display:flex;align-items:center;gap:10px;margin:42px 0 35px;padding:14px 16px;border:1px solid var(--cyan);border-radius:12px;background:#0b1828;box-shadow:0 0 0 1px #38e8ff22,0 0 28px #38e8ff18}.quick-add input#newTask{min-width:150px;flex:1;border:0;outline:0;color:var(--text);background:transparent}.quick-add input::placeholder{color:#64869a}.field{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;white-space:nowrap}.field input,.field select{padding:7px 6px;border:1px solid var(--line);border-radius:6px;color:var(--text);background:#102238;font-size:11px}.field input{width:165px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.section-head h2{margin:0;font-size:19px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.tasks{display:grid;gap:10px}.task{display:flex;gap:14px;padding:17px 18px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#0d2034,#091522);box-shadow:var(--shadow)}.task:hover{border-color:var(--cyan);box-shadow:0 0 0 1px #38e8ff44,0 0 25px #38e8ff16}.check{display:grid;place-items:center;flex:none;width:21px;height:21px;border:2px solid #46718b;border-radius:50%;color:#fff;background:transparent}.task.done .check{border-color:var(--cyan);background:#168da3}.task.done strong{color:#66869a;text-decoration:line-through}.task-info{min-width:0}.task-info strong{display:block;font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;color:var(--muted);font-size:11px}.meta span{display:inline-flex;align-items:center;gap:4px}.tag{padding:3px 7px;border:1px solid #2a5872;border-radius:7px;color:#9dd9e8;background:#12384d}.tag.high{color:#ffb9dd;border-color:#8c68c9;background:#35204b}.empty{padding:60px 20px;border:1px dashed #285473;border-radius:12px;color:var(--muted);text-align:center}.empty h3{color:var(--text);font-size:15px}.empty p{font-size:12px}@media(max-width:760px){.sidebar{width:68px;padding:24px 10px}.logo{margin:0 0 28px;font-size:0}.user{margin:0 0 22px}.user>div:last-child,.nav-label,.project,.logout{display:none}.nav button{font-size:0}.main{padding:35px 20px}.top{display:block}.actions{margin-top:22px}.search{width:100%}.quick-add{flex-wrap:wrap}.quick-add input#newTask{flex-basis:100%}.field input{width:145px}}
  </style>
</head>
<body>
  <div class="app"><aside class="sidebar"><div class="logo"><i class="logo-mark"></i> FLOWDAY</div><div class="user"><div class="avatar">M</div><div><strong>MY WORKSPACE</strong><small>LOCAL MODE</small></div></div><nav class="nav"><button class="active" data-view="today">▣　<span data-t="today"></span></button><button data-view="inbox">□　<span data-t="inbox"></span></button><button data-view="all">✓　<span data-t="all"></span></button></nav><div class="nav-label"><span data-t="projects"></span><span>＋</span></div><button class="project" data-project="產品開發"><i></i><span data-t="product"></span></button><button class="project" data-project="個人收件匣"><i></i><span data-t="inbox"></span></button><button class="logout">↪　<span data-t="logout"></span></button></aside>
  <main class="main"><header class="top"><div><p class="eyebrow" id="date"></p><h1><span data-t="greeting"></span>，MY WORKSPACE <span class="wave">✦</span></h1><p class="welcome" data-t="welcome"></p></div><label class="search">⌕ <input id="search" data-placeholder="search"></label></header>
  <form class="quick-add" id="taskForm"><span style="color:var(--cyan)">＋</span><input id="newTask" data-placeholder="newTask" autocomplete="off"><label class="field"><span data-t="due"></span><input id="newDue" type="datetime-local"></label><label class="field"><span data-t="priority"></span><select id="newPriority"><option value="低" data-t="low"></option><option value="一般" selected data-t="normal"></option><option value="高" data-t="high"></option><option value="緊急" data-t="urgent"></option></select></label></form>
  <section class="section-head"><div><h2 id="viewTitle"></h2><p id="count"></p></div></section><section class="tasks" id="tasks"></section></main></div>
  <script>
    const text={today:'\u4eca\u5929',inbox:'\u6536\u4ef6\u5323',all:'\u6240\u6709\u4efb\u52d9',projects:'\u5c08\u6848',product:'\u7522\u54c1\u958b\u767c',logout:'\u767b\u51fa',greeting:'\u65e9\u5b89',welcome:'\u4eca\u5929\u4e5f\u8981\u5143\u6c23\u6eff\u6eff\uff0c\u5b8c\u6210\u6700\u91cd\u8981\u7684\u4e8b\uff01',search:'\u641c\u5c0b\u4efb\u52d9...',newTask:'\u65b0\u589e\u4e00\u500b\u4efb\u52d9\uff0c\u6309 Enter \u5efa\u7acb',due:'\u9810\u8a08\u5b8c\u6210',priority:'\u512a\u5148\u6b21\u5e8f',low:'\u4f4e',normal:'\u4e00\u822c',high:'\u9ad8',urgent:'\u7dca\u6025',created:'\u5efa\u7acb',planned:'\u9810\u8a08\u5b8c\u6210',finished:'\u5df2\u5b8c\u6210',unset:'\u672a\u8a2d\u5b9a',unfinished:'\u672a\u5b8c\u6210',tasks:'\u500b\u5f85\u8655\u7406\u4efb\u52d9'};
    document.querySelectorAll('[data-t]').forEach(e=>e.textContent=text[e.dataset.t]);document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=text[e.dataset.placeholder]);
    const seed=[{id:1,title:'\u6574\u7406\u672c\u9031\u7522\u54c1\u9700\u6c42',project:'\u7522\u54c1\u958b\u767c',priority:'\u9ad8',status:'todo',done:false,createdAt:'2026-09-14T09:00:00+08:00',dueAt:'2026-09-14T18:00:00+08:00',completedAt:null},{id:2,title:'MVP \u9996\u9801\u4e92\u52d5\u6d41\u7a0b',project:'\u7522\u54c1\u958b\u767c',priority:'\u4e00\u822c',status:'in_progress',done:false,createdAt:'2026-09-14T10:30:00+08:00',dueAt:null,completedAt:null},{id:3,title:'\u56de\u8986\u91cd\u8981\u8a0a\u606f',project:'\u500b\u4eba\u6536\u4ef6\u5323',priority:'\u4e00\u822c',status:'completed',done:true,createdAt:'2026-09-13T14:00:00+08:00',dueAt:'2026-09-14T12:00:00+08:00',completedAt:'2026-09-14T11:45:00+08:00'}];
    const key='flowday-clean-tasks';let tasks=JSON.parse(localStorage.getItem(key)||'null')||seed;tasks=tasks.map(t=>({...t,createdAt:t.createdAt||new Date().toISOString(),dueAt:t.dueAt||null,completedAt:t.completedAt||null}));let view='today',projectFilter='';const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(tasks))}function dt(v){return v?new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v)):text.unset}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function render(){const q=$('search').value.trim().toLowerCase();const visible=tasks.filter(t=>(projectFilter?t.project===projectFilter:view==='all'||(view==='today'&&!t.done)||(view==='inbox'&&t.project==='\u500b\u4eba\u6536\u4ef6\u5323'))&&t.title.toLowerCase().includes(q));$('viewTitle').textContent=projectFilter||text[view];$('count').textContent=visible.filter(t=>!t.done).length+' '+text.tasks;$('tasks').innerHTML=visible.length?visible.map(t=>`<article class="task ${t.done?'done':''}"><button class="check" data-id="${t.id}" aria-label="complete">${t.done?'✓':''}</button><div class="task-info"><strong>${esc(t.title)}</strong><div class="meta"><span>▣ ${esc(t.project)}</span><span>▣ ${text.created}：${dt(t.createdAt)}</span><span>◷ ${text.planned}：${dt(t.dueAt)}</span><span>✓ ${text.finished}：${t.completedAt?dt(t.completedAt):text.unfinished}</span><span class="tag ${t.priority==='高'||t.priority==='緊急'?'high':''}">${esc(t.priority)}</span></div></div></article>`).join(''):`<div class="empty"><h3>${text.unfinished}</h3><p>${text.newTask}</p></div>`;document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>String(x.id)===b.dataset.id);t.done=!t.done;t.status=t.done?'completed':'todo';t.completedAt=t.done?new Date().toISOString():null;save();render()})}
    $('taskForm').onsubmit=e=>{e.preventDefault();const title=$('newTask').value.trim();if(!title)return;tasks.unshift({id:Date.now(),title,project:projectFilter||'\u500b\u4eba\u6536\u4ef6\u5323',priority:$('newPriority').value,status:'todo',done:false,createdAt:new Date().toISOString(),dueAt:$('newDue').value?new Date($('newDue').value).toISOString():null,completedAt:null});$('newTask').value='';$('newDue').value='';$('newPriority').value='\u4e00\u822c';save();render()};$('search').oninput=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;projectFilter='';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{projectFilter=b.dataset.project;render()});$('date').textContent=new Intl.DateTimeFormat('zh-TW',{weekday:'long',month:'long',day:'numeric'}).format(new Date());render();
  </script>
</body>
</html>
